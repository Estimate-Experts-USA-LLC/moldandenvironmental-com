<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request received | Mold and Environmental of Central Florida</title>
<!-- A confirmation page has no search value and must never compete with a
     service page in the index. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://moldandenvironmental.com/request-received/">
<style>
  :root { --ink:#12321f; --body:#243b30; --line:#cfd8d3; --bg:#f4f8f6; --accent:#1e7b45; }
  *,*::before,*::after { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:var(--body); line-height:1.6; background:#fff; }
  .wrap { max-width:640px; margin:0 auto; padding:48px 20px 64px; }
  h1 { color:var(--ink); font-size:clamp(24px,5vw,32px); line-height:1.25; margin:0 0 16px; }
  .card { border:1px solid var(--line); border-left:5px solid var(--accent);
          border-radius:8px; background:var(--bg); padding:24px; }
  .ref { font-size:14px; color:#4a5c53; margin:16px 0 0; }
  .ref strong { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ink);
                font-size:16px; letter-spacing:.3px; }
  .contact { margin:28px 0 0; padding-top:20px; border-top:1px solid var(--line); }
  a { color:var(--accent); font-weight:700; word-break:break-word; }
  .muted { font-size:14px; color:#4a5c53; }
</style>
<link rel="stylesheet" href="/assets/css/mold-design-system.css?v=1" />
</head>
<body>
<main class="wrap">
  <div class="card" id="ok">
    <h1>Thank you. We received your request.</h1>
    <!-- Deliberately no response-time promise. We have not verified one, and an
         unmet "within 1 hour" is worse than no number at all. -->
    <p>A member of our team will contact you about your property.</p>
    <p class="ref" id="refline" hidden>Your reference: <strong id="ref"></strong></p>
  </div>

  <div class="contact">
    <p><strong>Call:</strong> <a href="tel:+17547038317">(754)&nbsp;703-8317</a></p>
    <p><strong>Email:</strong> <a href="mailto:moldandenvironmental@gmail.com">moldandenvironmental@gmail.com</a></p>
    <p class="muted">Mold and Environmental of Central Florida &middot;
      Florida Mold Assessor MRSA3298 &middot; Florida Mold Remediator MRSR3880</p>
  </div>
</main>
<script>
  // H9: the API only ever 303s here on SUCCESS, with ?ref=<reference>. A failed
  // submission goes to /request-received/error/ instead -- a separate static
  // page with no script dependency, so it is correct by default for a no-JS
  // visitor. Do not reintroduce a ?status=error branch on this page: that was
  // the original defect (see src/shared/redirect.mjs in mold-leads-api).
  // Only the reference is ever passed here - never a name, email, phone or address.
  (function () {
    var p = new URLSearchParams(location.search);
    var ref = (p.get('ref') || '').replace(/[^A-Za-z0-9-]/g, '').slice(0, 64); // no HTML can enter
    if (ref) {
      document.getElementById('ref').textContent = ref;
      document.getElementById('refline').hidden = false;
    }
  })();
</script>
</body>
</html>
