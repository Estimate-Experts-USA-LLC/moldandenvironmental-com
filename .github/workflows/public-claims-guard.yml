# Fails the build if production-renderable content makes an unsupported
# credential claim. Runs on every push/PR to main and daily, because the
# claims can also change via a content edit nobody routes through review.
name: public-claims-guard
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Audit public credential claims
        run: node tools/public-claims-guard.mjs
      - name: Prove the guard can still go red
        run: |
          set -e
          cp index.html /tmp/idx.bak
          python3 - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8',errors='replace').read()
          assert '</body>' in s
          s=s.replace('</body>','<p>IICRC Certified Experts</p></body>',1)
          open(p,'w',encoding='utf-8',newline='').write(s)
          assert 'IICRC Certified Experts' in open(p,encoding='utf-8',errors='replace').read()
          PY
          if node tools/public-claims-guard.mjs > /dev/null 2>&1; then
            cp /tmp/idx.bak index.html
            echo "::error::NULL CONTROL FAILED - the guard passed on deliberately broken content"
            exit 1
          fi
          cp /tmp/idx.bak index.html
          node tools/public-claims-guard.mjs
          echo "null control OK: guard fails on injected claim, passes when restored"
      - name: Audit asset references (no 404s, incl. srcset and query strings)
        run: node tools/asset-guard.mjs
      - name: Prove the asset guard can go red
        # This null control INJECTS the srcset it needs rather than requiring one
        # to already exist. The previous version searched about/index.html for a
        # srcset and asserted it found one -- then that page was rebuilt without
        # srcset markup, the anchor vanished, and this step failed on every push
        # from a2e7fac onwards. Failing closed was right; depending on markup
        # somebody else owns was not.
        run: |
          set -e
          cp index.html /tmp/idx2.bak
          python3 - <<'PY'
          import io, re
          p = 'index.html'
          s = io.open(p, encoding='utf-8', errors='replace').read()
          m = re.search(r'<img\s+src="(/wp-content/[^"]+)"', s)
          assert m, 'no local <img src> on the homepage to attach a srcset to'
          inject = ' srcset="%s 400w, /wp-content/uploads/2099/01/missing-768x512.jpg 768w"' % m.group(1)
          s2 = s[:m.end()] + inject + s[m.end():]
          assert s2 != s
          io.open(p, 'w', encoding='utf-8', newline='').write(s2)
          back = io.open(p, encoding='utf-8', errors='replace').read()
          assert 'missing-768x512' in back, 'mutation did not reach disk'
          PY
          if node tools/asset-guard.mjs > /dev/null 2>&1; then
            cp /tmp/idx2.bak index.html
            echo "::error::NULL CONTROL FAILED - asset guard passed a missing srcset candidate"
            exit 1
          fi
          cp /tmp/idx2.bak index.html
          node tools/asset-guard.mjs
          echo "null control OK: asset guard fails on a missing srcset candidate, passes when restored"
      # ---- layout: measured in a real browser -----------------------------
      # The two guards above read the HTML source. They cannot see what the
      # browser actually painted: which colour landed on which background,
      # which element's min-content width forced a sideways scroll, whether the
      # headings share a left rail. Four defects of exactly that kind shipped to
      # production on 2026-08-14 and survived every static check until someone
      # looked at the page. This step is that look, automated.
      - name: Install Chromium for the layout guard
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      # Server, guard and null control share ONE step: a background process
      # started in an earlier step is not guaranteed to still be running in a
      # later one, and a guard that cannot reach the site would fail for the
      # wrong reason -- or, worse, be "fixed" by making it tolerate that.
      - name: Audit rendered layout, then prove the guard can go red
        run: |
          set -e
          python3 -m http.server 8791 --bind 127.0.0.1 > /dev/null 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -fsS -o /dev/null http://127.0.0.1:8791/ && break
            sleep 0.25
          done
          curl -fsS -o /dev/null http://127.0.0.1:8791/ || { echo "::error::static server never came up"; exit 1; }

          node tools/layout-guard.mjs http://127.0.0.1:8791

          # The null control re-runs the guard once per mutation. Across every
          # page that would be ~350 page loads, so it is scoped to three pages
          # that between them carry all the measured components: a dark CTA
          # panel, dark-section steps, a prose column and the footer.
          LAYOUT_GUARD_PAGES=/,/privacy-policy/,/containment-in-affected-areas/             node tools/layout-guard-null-control.mjs http://127.0.0.1:8791
